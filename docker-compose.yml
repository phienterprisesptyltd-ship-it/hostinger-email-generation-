version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: synchrobuild
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: synchrobuild
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synchrobuild"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://synchrobuild:development_password@db:5432/synchrobuild
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN}
      HOSTINGER_MAILBOX_RESOURCE_ID: ${HOSTINGER_MAILBOX_RESOURCE_ID}
      HOSTINGER_SENDER_ADDRESS: ${HOSTINGER_SENDER_ADDRESS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: development
      DEBUG: "true"
      BUSINESS_TIMEZONE: Australia/Sydney
      AUTONOMOUS_MODE: "false"
      ENABLE_TEST_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
